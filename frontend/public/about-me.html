<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <title>关于我</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(to bottom, #a6c1ee 0%, #fbc2eb 100%);
      }
      #about-me-main-frame {
        max-width: 720px;
        margin: 0 auto;
        padding: 48px 16px;
      }
      .card {
        padding: 16px;
        border-radius: 8px;
        background-color: rgba(255, 255, 255, 0.3);
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
        margin-bottom: 16px;
      }
      #header {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #avatar {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #fff;
      }
      h1 {
        margin: 0;
        color: #3a3a8c;
      }
      .motto {
        color: #555;
        font-style: italic;
      }
      .styled-table {
        border-collapse: collapse;
        width: 100%;
      }
      .styled-table th,
      .styled-table td {
        padding: 8px 12px;
        text-align: left;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }
      .styled-table th {
        color: #3a3a8c;
        width: 120px;
      }
      .styled-list li {
        line-height: 2em;
      }
      #footer {
        text-align: center;
        color: #555;
      }
      a {
        color: #3a3a8c;
      }
      #controls {
        position: absolute;
        top: 16px;
        right: 16px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        padding: 8px 14px;
        border: none;
        border-radius: 20px;
        cursor: pointer;
        background-color: rgba(255, 255, 255, 0.4);
        color: #3a3a8c;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
      }
      body.dark {
        color: #ccd0e0;
        background: linear-gradient(to bottom, #1f2233 0%, #2d2440 100%);
      }
      body.dark .card {
        background-color: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 18px rgba(0, 0, 0, 0.5);
      }
      body.dark h1,
      body.dark h2,
      body.dark .styled-table th,
      body.dark a {
        color: #aab4ff;
      }
      body.dark .motto,
      body.dark .styled-table td,
      body.dark #footer,
      body.dark .styled-list li {
        color: #ccd0e0;
      }
      body.dark .styled-table th,
      body.dark .styled-table td {
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }
      body.dark #avatar {
        border-color: #aab4ff;
      }
      body.dark #controls button {
        background-color: rgba(255, 255, 255, 0.1);
        color: #aab4ff;
      }
      body.dark hr {
        border-color: rgba(255, 255, 255, 0.2);
      }
      #github-repos {
        list-style: none;
        padding-left: 0;
      }
      #github-repos li {
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div id="controls">
      <button id="language-toggle">English</button>
      <button id="theme-toggle">切换暗色模式</button>
    </div>
    <div id="about-me-main-frame">
      <div class="card" id="header">
        <img id="avatar" src="./assets/tsinghua-fall.jpg" alt="我的头像" title="头像" />
        <div>
          <h1 data-zh="你好，我是龚伯熙" data-en="Hi, I'm Gong Boxi">你好，我是龚伯熙</h1>
          <p class="motto" data-zh="「深刻而不深沉，平淡而不平庸」" data-en='"Deep yet not heavy, plain yet not mediocre"'>「深刻而不深沉，平淡而不平庸」</p>
          <p id="clock"></p>
        </div>
      </div>

      <div class="card">
        <h2 data-zh="基本信息" data-en="Basic Info">基本信息</h2>
        <table class="styled-table">
          <tr>
            <th data-zh="院系" data-en="Department">院系</th>
            <td data-zh="笃实书院" data-en="Dushi College">笃实书院</td>
          </tr>
          <tr>
            <th data-zh="年级" data-en="Grade">年级</th>
            <td data-zh="2025 级本科生" data-en="Class of 2025 Undergraduate">2025 级本科生</td>
          </tr>
          <tr>
            <th data-zh="家乡" data-en="Hometown">家乡</th>
            <td data-zh="湖北仙桃" data-en="Xiantao, Hubei">湖北仙桃</td>
          </tr>
          <tr>
            <th data-zh="联系方式" data-en="Contact">联系方式</th>
            <td><a href="mailto:gbx25@mails.tsinghua.edu.cn">gbx25@mails.tsinghua.edu.cn</a></td>
          </tr>
        </table>
      </div>

      <div class="card">
        <h2 data-zh="兴趣爱好" data-en="Hobbies">兴趣爱好</h2>
        <ul class="styled-list">
          <li><strong data-zh="音乐" data-en="Music">音乐</strong><span data-zh="：摇滚，后朋" data-en=": Rock, Post-punk">：摇滚，后朋</span></li>
          <li><strong data-zh="运动" data-en="Sports">运动</strong><span data-zh="：篮球，台球" data-en=": Basketball, Billiards">：篮球，台球</span></li>
        </ul>
      </div>

      <div class="card">
        <h2 data-zh="我的 GitHub 公开仓库" data-en="My Public GitHub Repositories">我的 GitHub 公开仓库</h2>
        <ul id="github-repos">
          <li data-zh="加载中..." data-en="Loading...">加载中...</li>
        </ul>
      </div>

      <div id="footer">
        <hr />
        <p><a href="./index.html" data-zh="返回首页" data-en="Back to Home">返回首页</a></p>
      </div>
    </div>
    <script src="./about-me.js" defer></script>
  </body>
</html>
