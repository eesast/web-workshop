mutation addMessage($user_uuid: uuid!, $room_uuid: uuid!, $content: String!, $parent_uuid: uuid) {
  insert_message_one(object: {user_uuid: $user_uuid, room_uuid: $room_uuid, content: $content, parent_uuid: $parent_uuid}) {
    uuid
    parent {
      content
    }
  }
}

subscription getMessagesByRoom($room_uuid: uuid!) {
  message(where: {room_uuid: {_eq: $room_uuid}}) {
    uuid
    user {
      uuid
      username
    }
    content
    created_at
    parent {
      content
    }
  }
}
