mutation addMessage($user_uuid: uuid!, $room_uuid: uuid!, $content: String!, $reply_to_uuid: uuid) {
  insert_message_one(
    object: {user_uuid: $user_uuid, room_uuid: $room_uuid, content: $content, reply_to_uuid: $reply_to_uuid}
  ) {
    uuid
  }
}

subscription getMessagesByRoom($room_uuid: uuid!) {
  message(where: {room_uuid: {_eq: $room_uuid}}) {
    uuid
    user {
      uuid
      username
    }
    content
    reply_to_uuid
    reply_to {
      uuid
      content
      user {
        username
      }
    }
    created_at
  }
}
