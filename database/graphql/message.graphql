mutation addMessage($user_uuid: uuid!, $room_uuid: uuid!, $content: String!, $reply_uuid: uuid) {
  insert_message_one(object: {user_uuid: $user_uuid, room_uuid: $room_uuid, content: $content, reply_uuid: $reply_uuid}) {
    uuid
  }
}

subscription getMessagesByRoom($room_uuid: uuid!) {
  message(where: {room_uuid: {_eq: $room_uuid}}) {
    uuid
    user {
      uuid
      username
    }
    # 被回复的消息，只展开一层（没有多层回复）
    reply_uuid
    reply {
      uuid
      content
      user {
        uuid
        username
      }
    }
    content
    created_at
  }
}
