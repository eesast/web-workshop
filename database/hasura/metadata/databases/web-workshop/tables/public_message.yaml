table:
  name: message
  schema: public
object_relationships:
  - name: replied_to
    using:
      foreign_key_constraint_on: reply_to
  - name: room
    using:
      foreign_key_constraint_on: room_uuid
  - name: user
    using:
      foreign_key_constraint_on: user_uuid
array_relationships:
  - name: replies
    using:
      foreign_key_constraint_on:
        column: reply_to
        table:
          name: message
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - content
        - created_at
        - reply_to
        - room_uuid
        - user_uuid
        - uuid
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - content
        - created_at
        - reply_to
        - room_uuid
        - user_uuid
        - uuid
      filter: {}
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - content
        - created_at
        - reply_to
        - room_uuid
        - user_uuid
        - uuid
      filter: {}
      check: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter: {}
    comment: ""
